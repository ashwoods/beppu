[project]
name = "beppu"
version = "0.1.0"
description = "An Enum-keyed async event: wait until a basket holds a given member"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ashley Camba Garrido", email = "ashwoods@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Framework :: AsyncIO",
    "Framework :: Trio",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
anyio = ["anyio>=4.7"]

[project.urls]
Homepage = "https://github.com/ashwoods/beppu"
Changelog = "https://github.com/ashwoods/beppu/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["anyio>=4.7", "pyright", "pytest", "ruff", "trio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["beppu", "tests", "CHANGELOG.md"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]

[tool.pyright]
include = ["beppu", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
